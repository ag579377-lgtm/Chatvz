20px;margin:0 0 4px}.profile .profileInfo{font-size:13px;color:#667085}.profile .profileActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:14px 0}.profile .profileActions button:first-child{grid-column:1/-1}.profile .profileSection{margin-top:18px;padding-top:14px;border-top:1px solid #e4e7ec}.profile .profileSection h4{margin:0 0 10px}.profile .profileClose{display:none}.profile button{padding:11px 13px}.avatar{width:90px;height:90px;border-radius:50%;object-fit:cover;background:#dbe4f0;display:block}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.small{font-size:12px}.nav{display:flex;gap:6px;margin:14px 0}.nav button{flex:1;padding:8px 6px}.user{display:flex;align-items:center;gap:7px}.user .uavatar{width:42px;height:42px;min-width:42px;max-width:42px;border-radius:50%;object-fit:cover;background:#dbe4f0;display:block;flex:0 0 42px}.user .udata{min-width:0;flex:1}.user .chatAction{flex:0 0 auto}.user .udata{min-width:0}.user .udata b{display:block}.chatList{padding:10px}.chatItem{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;cursor:pointer}.chatItem:hover{background:#f2f4f7}.chatItem .chatAvatar{width:42px;height:42px;min-width:42px;max-width:42px;border-radius:50%;object-fit:cover;background:#dbe4f0;display:block;flex:0 0 42px}.chatItem .chatText{min-width:0;flex:1}.chatItem .chatAction{flex:0 0 auto;padding:7px 9px}.user .chatAction{margin-left:auto;padding:7px 9px}.chatItem .chatText b{display:block}.chatItem .preview{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.backChat{display:none}.danger{background:#d92d20}.file{display:none}.reportBtn{margin-top:7px}.adminReport{border:1px solid #e4e7ec;border-radius:10px;padding:10px;margin:8px 0;background:#fff}.footer{font-size:11px;color:#667085;text-align:center;padding:10px}@media(max-width:1100px){.app{grid-template-columns:220px 1fr}.profile{display:none}.messages{padding:16px}.msg{max-width:82%}}@media(max-width:700px){html,body{width:100%;height:100%;min-height:100dvh}.auth{width:100%;height:100dvh;min-height:100dvh;padding:0;display:block}.auth .card{width:100%;min-height:100dvh;border-radius:0;box-shadow:none;padding:22px 16px}.app{display:flex;width:100%;height:100dvh;min-height:100dvh;flex-direction:column}.side{display:block;border-right:0;border-bottom:1px solid #e4e7ec;padding:8px 10px;overflow:hidden;flex:0 0 auto;background:#fff}.side.browseMode{position:fixed;inset:0;z-index:20;width:100%;height:100dvh;overflow-y:auto;padding:10px 12px;background:#fff}.side.browseMode~.main{display:none}.side.mobileChatMode{display:none}.side.mobileChatMode~.main{display:flex;position:fixed;inset:0;z-index:10;width:100%;height:100dvh}.side h2{display:none}.side #meLabel{display:inline-block;margin:0 8px 0 0}.side #logout{padding:7px 10px}.side .nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 0}.side .nav button{min-height:42px;padding:9px 4px;white-space:nowrap}.side #roomSection,.side #userSection,.side #chatListSection,.side #onlineSection,.side #matchesSection{margin-top:4px;padding-bottom:2px}.side #users,.side #rooms,.side #chatList{max-height:none;overflow:visible;scrollbar-width:auto;-ms-overflow-style:auto;contain:none}.side #users::-webkit-scrollbar,.side #rooms::-webkit-scrollbar,.side #chatList::-webkit-scrollbar{display:block}.side #roomSection h3,.side #userSection h3,.side #chatListSection h3,.side #onlineSection h3,.side #matchesSection h3{margin:0;padding:6px 2px;background:#fff}.side #search{margin-bottom:6px}.main{min-height:0;flex:1;display:flex}.top{padding:10px 12px;min-height:48px;flex:0 0 auto}.messages{padding:12px 10px;min-height:0}.msg{max-width:88%;font-size:15px;padding-left:48px}.msg img{max-width:min(280px,75vw);height:auto}.composer{padding:8px;gap:6px;position:sticky;bottom:0;z-index:2}.composer input{font-size:16px;padding:11px 10px}.composer button{padding:10px 11px}.composer label button{width:44px}.user,.room,.chatItem{padding:10px;margin-bottom:4px}.card{padding:22px}.auth{padding:14px}.profile.profileOpen{display:block;position:fixed;inset:0;z-index:30;width:100%;height:100dvh;padding:16px;overflow-y:auto;border:0}.profile.profileOpen .profileClose{display:inline-block;margin-bottom:12px}.profile.profileOpen .profileHero .avatar{width:118px;height:118px;flex-basis:118px}.profile.profileOpen .profileActions{grid-template-columns:1fr 1fr}}@media(max-width:420px){.side #users,.side #rooms,.side #chatList{max-height:none;overflow:visible}.composer{gap:5px}.composer #text{min-width:0}.composer #send{padding:10px 9px}.messages{padding:10px 7px}.msg{max-width:92%;padding:9px 11px 9px 48px}}</style></head>
<body>
<section id="auth" class="auth"><div class="card">
<h1>ChatiNova</h1><p class="muted">Echter Login, Profile, Galerie und Live-Chat.</p>
<input id="nick" placeholder="Nickname"><input id="password" type="password" placeholder="Passwort (mind. 8 Zeichen)">
<div id="regFields" class="hidden"><input id="age" type="number" min="18" max="99" placeholder="Alter"><select id="state" style="width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;margin:7px 0 12px"><option value="">Bundesland auswählen</option><option>Baden-Württemberg</option><option>Bayern</option><option>Berlin</option><option>Brandenburg</option><option>Bremen</option><option>Hamburg</option><option>Hessen</option><option>Mecklenburg-Vorpommern</option><option>Niedersachsen</option><option>Nordrhein-Westfalen</option><option>Rheinland-Pfalz</option><option>Saarland</option><option>Sachsen</option><option>Sachsen-Anhalt</option><option>Schleswig-Holstein</option><option>Thüringen</option></select></div>
<label id="consentWrap" class="small hidden"><input id="consent" type="checkbox" style="width:auto;margin-right:6px"> Ich akzeptiere die Nutzungsregeln und habe die Datenschutzhinweise gelesen.</label><button id="submit">Einloggen</button><button id="toggle" class="secondary" style="margin-top:8px">Noch nicht registriert</button><p id="error" class="muted"></p><div class="footer"><button class="secondary legalLink" onclick="showLegal('impressum')">Impressum</button> <button class="secondary legalLink" onclick="showLegal('datenschutz')">Datenschutz</button> <button class="secondary legalLink" onclick="showLegal('regeln')">Nutzungsregeln</button></div>
</div></section>
<section id="legal" class="auth hidden"><div class="card" style="max-width:760px"><button class="secondary" onclick="hideLegal()">← Zurück</button><div id="legalContent"></div></div></section>
<section id="app" class="app hidden">
<aside id="side" class="side"><h2>ChatiNova</h2><p id="meLabel" class="muted"></p><div style="display:flex;gap:6px"><button id="editProfileBtn" class="secondary">✏️ Profil bearbeiten</button><button id="logout" class="secondary">Abmelden</button></div><nav class="nav"><button id="showRooms">💬</button><button id="showUsers" class="secondary">👥</button><button id="showChats" class="secondary">✉️ <span id="chatBadge" class="small"></span></button><button id="showOnline" class="secondary">🟢</button><button id="showMatches" class="secondary">❤️</button></nav><section id="chatListSection" class="hidden"><h3>✉️ Nachrichten</h3><div id="chatList" class="chatList"></div></section><section id="roomSection"><h3>💬 Räume</h3><div id="rooms" class="rooms"></div></section><section id="userSection" class="hidden"><h3>👥 Benutzer</h3><input id="search" placeholder="Benutzer suchen"><button id="showBlocked" class="secondary" style="width:100%;margin:4px 0 8px">🚫 Blockierte Nutzer</button><div id="users"></div><div id="blockedUsers" class="hidden"></div></section><section id="onlineSection" class="hidden"><h3>🟢 Wer ist online?</h3><div id="onlineUsers"></div></section><section id="matchesSection" class="hidden"><h3>❤️ Matches</h3><div id="matches"></div></section></aside>
<main class="main"><div class="top"><button id="backChat" class="secondary backChat">←</button><div><strong id="chatTitle">Lounge</strong><div id="chatSubtitle" class="small muted"></div></div><span id="status" class="muted">Verbinde…</span></div><div id="messages" class="messages"></div><div class="composer"><label><input id="chatFile" class="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><button class="secondary" id="photoBtn">📷</button></label><input id="text" placeholder="Nachricht…"><button id="send">Senden</button></div></main>
<aside id="profilePanel" class="profile"><button id="profileClose" class="secondary profileClose">← Zurück</button><div id="myProfile"><h3>Mein Profil</h3><img id="avatar" class="avatar" alt="" onerror="this.onerror=null;this.src=avatarFallback()"><p><b id="profileNick"></b></p><div style="margin:14px 0;padding:14px;border:1px solid #e4e7ec;border-radius:12px;background:#f8fafc"><h4 style="margin:0 0 8px">Profil bearbeiten</h4><label class="small muted">Alter</label><input id="profileAge" type="number" min="18" max="99" placeholder="Alter"><label class="small muted">Bundesland</label><select id="profileState" style="width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;margin:7px 0 12px"><option value="">Bundesland auswählen</option><option>Baden-Württemberg</option><option>Bayern</option><option>Berlin</option><option>Brandenburg</option><option>Bremen</option><option>Hamburg</option><option>Hessen</option><option>Mecklenburg-Vorpommern</option><option>Niedersachsen</option><option>Nordrhein-Westfalen</option><option>Rheinland-Pfalz</option><option>Saarland</option><option>Sachsen</option><option>Sachsen-Anhalt</option><option>Schleswig-Holstein</option><option>Thüringen</option></select><label class="small muted">Über mich</label><textarea id="profileAbout" maxlength="1000" placeholder="Erzähl etwas über dich…"></textarea><button id="saveProfile">💾 Profil speichern</button></div><input id="avatarFile" class="file" type="file" accept="image/*"><button class="secondary" id="avatarBtn">Profilbild ändern</button><h4>Meine Galerie</h4><input id="galleryFile" class="file" type="file" multiple accept="image/*"><button class="secondary" id="galleryBtn">Bilder hinzufügen</button><div id="gallery" class="gallery" style="margin-top:10px"></div><hr><button id="deleteAccount" class="danger">Konto löschen</button><div id="adminPanel" class="hidden"><hr><h3>🛡️ Moderation</h3><div id="reports"></div></div></div><div id="userProfile" class="hidden"><div class="profileHero"><div class="profileHead"><img id="userAvatar" class="avatar" alt="" onerror="this.onerror=null;this.src=avatarFallback()"></div><h3 id="userProfileTitle" class="profileName">Profil</h3><div id="userInfo" class="profileInfo"></div><div id="userStatus" class="profileStatus"></div><p id="userAbout" class="profileAbout"></p></div><div class="profileActions"><button id="dmBtn">💬 Nachricht</button><button id="favBtn" class="secondary">⭐ Favorisieren</button><button id="blockBtn" class="danger">🚫 Blockieren</button><button id="reportUserBtn" class="secondary">⚠️ Melden</button></div><div class="profileSection"><h4>Galerie</h4><div id="userGallery" class="gallery"></div></div></div></aside>
</section>
<script>
let token=localStorage.getItem("chatinova_token"), me=null, ws=null, roomId=1, roomName="Lounge", dmUser=null, register=false, selectedUser=null;
const $=id=>document.getElementById(id), api=async(path,opt={})=>{opt.headers=opt.headers||{};opt.headers.Authorization="Bearer "+token;const r=await fetch(path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Fehler");return d};
function err(e){$("error").textContent=e.message}
const legalTexts={
 impressum:`<h1>Impressum</h1><p><b>Betreiber:</b> [DEIN NAME / FIRMA]</p><p><b>Anschrift:</b> [DEINE LADUNGSFÄHIGE ANSCHRIFT]</p><p><b>E-Mail:</b> [DEINE E-MAIL-ADRESSE]</p><p>Bitte ersetze die Platzhalter vor dem öffentlichen Start durch deine tatsächlichen Anbieterangaben. Die Angaben müssen leicht erkennbar, unmittelbar erreichbar und dauerhaft verfügbar sein.</p>`,
 datenschutz:`<h1>Datenschutzerklärung</h1><p><b>Verantwortlicher:</b> [DEIN NAME / FIRMA, ANSCHRIFT, E-MAIL]</p><h3>Welche Daten verarbeitet ChatiNova?</h3><p>Bei Registrierung werden insbesondere Nickname, Passwort-Hash, Alter und Bundesland gespeichert. Für Anmeldung, Betrieb und Sicherheit können technische Verbindungsdaten verarbeitet werden.</p><p>Bei der Nutzung können außerdem Profilangaben, Profilbilder, Galerie-Bilder, Chatnachrichten, Bildnachrichten, Meldungen und technische Sicherheitsdaten verarbeitet und gespeichert werden.</p><h3>Hosting und Dienste</h3><p>ChatiNova verwendet PostgreSQL und wird aktuell über Render betrieben. Die konkreten Anbieter, Speicherorte, Aufbewahrungsfristen und Rechtsgrundlagen müssen vor dem öffentlichen Start anhand der tatsächlich eingesetzten Dienste ergänzt werden.</p><h3>Betroffenenrechte</h3><p>Betroffene können – soweit die gesetzlichen Voraussetzungen vorliegen – insbesondere Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung und Widerspruch verlangen.</p><p><b>Wichtig:</b> Dieser Text ist eine technische Vorlage und keine individuelle Rechtsberatung. Vor dem öffentlichen Start müssen die tatsächlichen Datenflüsse und Anbieter vollständig geprüft und die Angaben entsprechend ergänzt werden.</p>`,
 regeln:`<h1>Nutzungsregeln</h1><ul><li>ChatiNova ist ausschließlich für volljährige Nutzer (18+) vorgesehen.</li><li><b>Einvernehmliche sexuelle Inhalte zwischen Erwachsenen sind grundsätzlich erlaubt.</b></li><li>Verboten sind sexuelle Inhalte mit Minderjährigen sowie Darstellungen sexuellen Missbrauchs oder sexualisierter Gewalt.</li><li>Verboten sind nicht einvernehmlich veröffentlichte intime Bilder oder Videos sowie Inhalte, die Persönlichkeitsrechte verletzen.</li><li>Keine Bedrohungen, Volksverhetzung, gezielte Belästigung oder sonstige rechtswidrige Inhalte.</li><li>Keine Inhalte, deren Verbreitung gesetzlich verboten ist.</li><li>Keine Verbreitung fremder privater Inhalte ohne Erlaubnis.</li><li>Keine urheberrechtsverletzenden Uploads.</li><li>Kein Spam, Betrug oder missbräuchliche Nutzung.</li><li>Keine Umgehung von Sperren oder technischen Schutzmaßnahmen.</li><li>Rechtswidrige oder regelwidrige Inhalte können gemeldet und nach Prüfung entfernt werden; Accounts können bei Verstößen eingeschränkt oder gelöscht werden.</li></ul><p><b>Hinweis:</b> Die Freigabe sexueller Inhalte gilt nur für Inhalte zwischen Erwachsenen und hebt gesetzliche Verbote nicht auf.</p><p>Mit der Registrierung akzeptierst du diese Nutzungsregeln.</p><p>Diese Regeln ersetzen keine individuelle Rechtsberatung und werden vor dem öffentlichen Start an das konkrete Moderations- und Beschwerdeverfahren angepasst.</p>`
};
function showLegal(type){$("auth").classList.add("hidden");$("app").classList.add("hidden");$("legal").classList.remove("hidden");$("legalContent").innerHTML=legalTexts[type]||""}
function hideLegal(){$("legal").classList.add("hidden");$("auth").classList.remove("hidden")}
$("toggle").onclick=()=>{register=!register;$("regFields").classList.toggle("hidden",!register);$("consentWrap").classList.toggle("hidden",!register);$("submit").textContent=register?"Registrieren":"Einloggen";$("toggle").textContent=register?"Zum Login":"Noch nicht registriert"};
$("submit").onclick=async()=>{try{const body={nick:$("nick").value,password:$("password").value};if(register){if(!$("consent").checked)throw Error("Bitte bestätige Nutzungsregeln und Datenschutzhinweise.");body.age=Number($("age").value);body.state=$("state").value}const d=await fetch(register?"/api/register":"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(r=>r.json().then(x=>{if(!r.ok)throw Error(x.error);return x}));token=d.token;localStorage.setItem("chatinova_token",token);start()}catch(e){err(e)}};
async function start(){try{me=await api("/api/me");$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("meLabel").textContent=me.nick+" · "+me.age;$("profileNick").textContent=me.nick;fillMyProfile(me);setAvatar(me.avatar_url);$("adminPanel").classList.toggle("hidden",!me.is_admin);if(me.is_admin)loadReports();await loadRooms();await loadUsers();await loadDmList();await loadGallery();roomId=1;roomName="Lounge";dmUser=null;showSidebarSection("rooms");$("chatTitle").textContent="ChatiNova";$("chatSubtitle").textContent="Wähle einen Bereich";$("backChat").style.display="none";$("messages").innerHTML="<div class=\"muted\" style=\"padding:20px;text-align:center\">Wähle links einen Raum oder öffne einen Bereich über die Navigation.</div>";connect()}catch(e){localStorage.removeItem("chatinova_token");$("error").textContent="Sitzung abgelaufen."}}
function setAvatar(u){me.avatar_url=u||"";$("avatar").src=u||avatarFallback()}
async function loadDmList(){try{const cs=await api("/api/dms");const unread=cs.reduce((n,c)=>n+Number(c.unread_count||0),0);$("chatBadge").textContent=unread?"🔴 "+unread:"";$("chatList").innerHTML=cs.length?cs.map(c=>`<div class="chatItem" data-id="${c.user_id}"><img class="chatAvatar" src="${c.avatar_url||avatarFallback()}"><div class="chatText"><b>${esc(c.nick)} ${c.unread_count?'<span class="small">🔴 '+c.unread_count+'</span>': ''} <span class="small">${c.online?"🟢":""}</span></b><span class="preview small muted">${esc(c.image_url?"📷 Bild":c.text||"Noch keine Nachricht")}</span></div></div>`).join(""):`<span class="small muted">Noch keine Privatchats.</span>`;document.querySelectorAll(".chatItem").forEach(x=>x.onclick=()=>openDm(Number(x.dataset.id)))}catch(e){console.error(e)}}
let roomNotifications={};
async function loadRoomNotifications(){try{const ns=await api("/api/room-notifications");roomNotifications={};ns.forEach(n=>roomNotifications[n.room_id]=n.has_new)}catch(e){console.error(e)}}
async function loadRooms(){const rs=await api("/api/rooms");await loadRoomNotifications();$("rooms").innerHTML=rs.map(r=>'<div class="room" data-id="'+r.id+'">💬 '+r.name+' '+(roomNotifications[r.id]?'🔴':'')+'</div>').join("");document.querySelectorAll(".room").forEach(x=>x.onclick=()=>joinRoom(Number(x.dataset.id),x.textContent.replace('🔴','').trim()))}
async function joinRoom(id,name){previousSection="rooms";dmUser=null;roomId=id;roomName=name;$("userProfile").classList.add("hidden");$("myProfile").classList.remove("hidden");selectedUser=null;$("profilePanel").classList.remove("profileOpen");showSidebarSection("rooms");$("side").classList.remove("browseMode");$("side").classList.add("mobileChatMode");$("chatSubtitle").textContent="Öffentlicher Raum";$("backChat").style.display="inline-block";$("text").placeholder="Nachricht…";$("chatTitle").textContent=name;$("messages").innerHTML="";const ms=await api("/api/rooms/"+id+"/messages");ms.forEach(renderRoom);roomNotifications[id]=false;await api("/api/rooms/"+id+"/read",{method:"POST"});await loadRooms();if(ws?.readyState===1)ws.send(JSON.stringify({type:"join_room",roomId:id}))}
let usersCache=[];async function loadUsers(){
  const q=$("search").value||"";
  const [us,favs]=await Promise.all([api("/api/users?q="+encodeURIComponent(q)),api("/api/favorites")]);
  const favIds=new Set(favs.map(u=>String(u.id)));
  const ordered=[...favs.filter(u=>!q||u.nick.toLowerCase().includes(q.toLowerCase())||String(u.state||"").toLowerCase().includes(q.toLowerCase())),
    ...us.filter(u=>!favIds.has(String(u.id)))];
  usersCache=[...usersCache.filter(x=>!ordered.some(u=>String(u.id)===String(x.id))),...ordered];

let previousSection="rooms"; function showSidebarSection(section){$("roomSection").classList.toggle("hidden",section!=="rooms");$("userSection").classList.toggle("hidden",section!=="users");$("chatListSection").classList.toggle("hidden",section!=="chats");$("onlineSection").classList.toggle("hidden",section!=="online");$("matchesSection").classList.toggle("hidden",section!=="matches");$("showRooms").classList.toggle("secondary",section!=="rooms");$("showUsers").classList.toggle("secondary",section!=="users");$("showChats").classList.toggle("secondary",section!=="chats");$("showOnline").classList.toggle("secondary",section!=="online");$("showMatches").classList.toggle("secondary",section!=="matches");$("side").classList.remove("browseMode","mobileChatMode");if(section==="online")loadOnline();if(section==="matches")loadMatches()}$("search").oninput=()=>loadUsers(); $("showBlocked").onclick=()=>{if($("blockedUsers").classList.contains("hidden"))loadBlockedUsers();else showNormalUsers()};let usersRefreshTimer=null;let roomRefreshTimer=null;function startUsersRefresh(){if(usersRefreshTimer)clearInterval(usersRefreshTimer);usersRefreshTimer=setInterval(()=>{if(token&&$("app")&&!$("app").classList.contains("hidden")){loadUsers().catch(()=>{});if(!$("onlineSection").classList.contains("hidden"))loadOnline().catch(()=>{});if(!$("matchesSection").classList.contains("hidden"))loadMatches().catch(()=>{})}},15000)}startUsersRefresh();roomRefreshTimer=setInterval(()=>{if(token&&$("app")&&!$("app").classList.contains("hidden"))loadRooms().catch(()=>{})},15000);$("showUsers").onclick=()=>showSidebarSection("users");$("showRooms").onclick=()=>showSidebarSection("rooms");$("showChats").onclick=()=>showSidebarSection("chats");$("showOnline").onclick=()=>showSidebarSection("online");$("showMatches").onclick=()=>showSidebarSection("matches");$("backChat").onclick=()=>{$("backChat").style.display="none";dmUser=null;$("side").classList.remove("mobileChatMode","browseMode");showSidebarSection(previousSection);$("text").placeholder="Nachricht…";$("chatTitle").textContent="ChatiNova";$("chatSubtitle").textContent="Wähle einen Bereich";$("messages").innerHTML="<div class=\"muted\" style=\"padding:20px;text-align:center\">Wähle links einen Raum oder öffne einen Bereich über die Navigation.</div>"};
async function openDm(id){previousSection=$("chatListSection").classList.contains("hidden")?($("userSection").classList.contains("hidden")?"rooms":"users"):"chats";dmUser=id;$("profilePanel").classList.remove("profileOpen");$("userProfile").classList.add("hidden");$("myProfile").classList.remove("hidden");$("side").classList.remove("browseMode");$("side").classList.add("mobileChatMode");const u=usersCache.find(x=>String(x.id)===String(id))||{nick:"Benutzer"};$("chatTitle").textContent="💬 Privatchat";$("chatSubtitle").textContent=(u.online?"🟢 Online · ":"")+"mit "+u.nick;$("backChat").style.display="inline-block";$("text").placeholder="Nachricht an "+(u.nick||"Benutzer")+"…";$("messages").innerHTML="";try{const ms=await api("/api/dm/"+id);ms.forEach(renderDm);await api("/api/dm/"+id+"/read",{method:"POST"});await loadDmList()}catch(e){alert(e.message)}}
function connect(){const p=location.protocol==="https:"?"wss":"ws";ws=new WebSocket(p+"://"+location.host+"?token="+encodeURIComponent(token));ws.onopen=()=>{$("status").textContent="Online";ws.send(JSON.stringify({type:"join_room",roomId}));};ws.onclose=()=>{$("status").textContent="Offline";setTimeout(connect,2500)};ws.onmessage=e=>{const x=JSON.parse(e.data);if(x.type==="room_message")renderRoom(x.message);if(x.type==="dm"){renderDm(x.message);loadDmList()}if(x.type==="message_deleted")removeMessage(x.messageId,x.messageType)}}
function renderRoom(m){if(dmUser)return;addMsg(m.nick,m.text,m.nick===me.nick,m.image_url,m.id,"room")}
function renderDm(m){

function chatAvatarForNick(n){const u=usersCache.find(x=>String(x.nick)===String(n));if(me&&String(n)===String(me.nick))return me.avatar_url||avatarFallback();return u?.avatar_url||avatarFallback()} function addMsg(n,t,mine,img,id,type="room"){const d=document.createElement("div");d.className="msg "+(mine?"mine":"");d.dataset.messageId=id||"";d.dataset.messageType=type;d.innerHTML='<div class="meta">'+esc(mine?"Du":n)+'</div>'+esc(t||"");const av=document.createElement("img");av.className="chatMessageAvatar";av.src=mine?(me?.avatar_url||avatarFallback()):chatAvatarForNick(n);av.onerror=()=>{av.onerror=null;av.src=avatarFallback()};av.title=mine?"Dein Profil":n+"s Profil";av.style.cursor="pointer";av.onclick=(e)=>{e.stopPropagation();if(mine)openMyProfile();else{const u=usersCache.find(x=>String(x.nick)===String(n));if(u?.id)showUserProfile(Number(u.id))}};d.prepend(av);if(img){const im=document.createElement("img");im.src=img;im.loading="lazy";d.appendChild(im);const rb=document.createElement("button");rb.className="secondary reportBtn";rb.textContent="⚠️ Melden";rb.onclick=()=>reportContent({messageId:id,messageType:type});d.appendChild(rb);if(mine){const b=document.createElement("button");b.className="secondary deleteImage";b.textContent="🗑️ Bild löschen";b.style.marginTop="7px";b.onclick=()=>deleteChatImage(id,type==="dm");d.appendChild(b)}}$("messages").appendChild(d);$("messages").scrollTop=$("messages").scrollHeight}
async function deleteChatImage(id,isDm){if(!id)return;if(!confirm("Eigenes Bild wirklich löschen?"))return;try{await api((isDm?"/api/dm-message/":"/api/chat-message/")+id,{method:"DELETE"});removeMessage(id,isDm?"dm":"room")}catch(e){alert(e.message)}}
function removeMessage(id,type){document.querySelectorAll(".msg").forEach(x=>{if(String(x.dataset.messageId)===String(id) && (!type || x.dataset.messageType===type))x.remove()})}
function esc(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
$("saveProfile").onclick=async()=>{try{const d=await api("/api/me",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({age:Number($("profileAge").value),state:$("profileState").value,about:$("profileAbout").value})});me=d;$("meLabel").textContent=me.nick+" · "+me.age;$("profileNick").textContent=me.nick;alert("Profil gespeichert.")}catch(e){alert(e.message)}}; async function prepareUploadImage(file){
  if(!file)return file;
  if(!/^image\/(jpeg|png|webp)$/i.test(file.type)||file.size<3*1024*1024)return file;
  try{
    const bitmap=await createImageBitmap(file);
    const max=1800;
    const scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(bitmap.width*scale));
    canvas.height=Math.max(1,Math.round(bitmap.height*scale));
    canvas.getContext("2d").drawImage(bitmap,0,0,canvas.width,canvas.height);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",0.82));
    bitmap.close();
    return blob?new File([blob],"photo.jpg",{type:"image/jpeg"}):file;
  }catch(e){return file}
}
async function upload(file,endpoint,field="image"){
  if(!file)throw Error("Bitte ein Bild auswählen.");
  const prepared=await prepareUploadImage(file);
  const f=new FormData();f.append(field,prepared,prepared.name||file.name);
  return api(endpoint,{method:"POST",body:f})
}
