<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ChatVZ</title>
<style>
html,body{width:100%;min-height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:#eef2f7;color:#182230}
button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:white;border-radius:18px;padding:28px;box-shadow:0 12px 40px #0001;width:min(440px,100%)}h1{margin:0 0 8px}.muted{color:#667085}
input,textarea{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;margin:7px 0 12px}button{border:0;border-radius:10px;padding:11px 15px;background:#1877f2;color:white;font-weight:700}button.secondary{background:#edf2f7;color:#344054}
.app{height:100vh;display:grid;grid-template-columns:260px 1fr 300px;background:#fff}.side{border-right:1px solid #e4e7ec;padding:18px;overflow:auto}.main{display:flex;flex-direction:column;min-width:0}.top{padding:16px 20px;border-bottom:1px solid #e4e7ec;display:flex;justify-content:space-between;align-items:center}.content{display:flex;flex:1;min-height:0}.rooms{padding:10px}.room,.user{padding:12px;border-radius:10px;margin-bottom:6px;cursor:pointer}.room:hover,.user:hover{background:#f2f4f7}.online{width:8px;height:8px;background:#12b76a;border-radius:50%;display:inline-block;margin-right:7px}
.messages{flex:1;overflow:auto;padding:20px;background:#f8fafc}.msg{max-width:75%;margin:8px 0;padding:10px 13px;border-radius:14px;background:#e9eef5}.mine{margin-left:auto;background:#1877f2;color:white}.meta{font-size:11px;opacity:.65;margin-bottom:4px}.msg img{max-width:280px;border-radius:10px;display:block;margin-top:6px}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #e4e7ec;background:#fff}.composer input{min-width:0}.composer button{flex:0 0 auto}.composer input{margin:0}.profile{padding:18px;overflow:auto}.avatar{width:90px;height:90px;border-radius:50%;object-fit:cover;background:#dbe4f0;display:block}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.small{font-size:12px}.nav{display:flex;gap:6px;margin:14px 0}.nav button{flex:1;padding:8px 6px}.user{display:flex;align-items:center;gap:7px}.user .uavatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#dbe4f0}.user .udata{min-width:0}.user .udata b{display:block}.danger{background:#d92d20}.file{display:none}.reportBtn{margin-top:7px}.adminReport{border:1px solid #e4e7ec;border-radius:10px;padding:10px;margin:8px 0;background:#fff}.footer{font-size:11px;color:#667085;text-align:center;padding:10px}@media(max-width:1100px){.app{grid-template-columns:220px 1fr}.profile{display:none}.messages{padding:16px}.msg{max-width:82%}}@media(max-width:700px){.app{display:flex;height:100dvh;flex-direction:column}.side{display:block;border-right:0;border-bottom:1px solid #e4e7ec;padding:8px 10px;overflow:visible;flex:0 0 auto}.side h2{display:none}.side #meLabel{display:inline-block;margin:0 8px 0 0}.side #logout{padding:7px 10px}.side .nav{display:flex;margin:8px 0 0}.side .nav button{min-height:42px}.side #roomSection,.side #userSection{max-height:30vh;overflow:auto}.main{min-height:0;flex:1}.top{padding:10px 12px;min-height:48px}.messages{padding:12px 10px}.msg{max-width:88%;font-size:15px}.msg img{max-width:min(280px,75vw);height:auto}.composer{padding:8px;gap:6px;position:sticky;bottom:0}.composer input{font-size:16px;padding:11px 10px}.composer button{padding:10px 11px}.composer label button{width:44px}.user,.room{padding:10px;margin-bottom:4px}.card{padding:22px}.auth{padding:14px}}@media(max-width:420px){.side #userSection{max-height:24vh}.side #roomSection{max-height:20vh}.composer{gap:5px}.composer #text{min-width:0}.composer #send{padding:10px 9px}.messages{padding:10px 7px}.msg{max-width:92%;padding:9px 11px}}
</style></head>
<body>
<section id="auth" class="auth"><div class="card">
<h1>ChatVZ</h1><p class="muted">Echter Login, Profile, Galerie und Live-Chat.</p>
<input id="nick" placeholder="Nickname"><input id="password" type="password" placeholder="Passwort (mind. 8 Zeichen)">
<div id="regFields" class="hidden"><input id="age" type="number" min="18" max="99" placeholder="Alter"><input id="city" placeholder="Stadt"></div>
<label id="consentWrap" class="small hidden"><input id="consent" type="checkbox" style="width:auto;margin-right:6px"> Ich akzeptiere die Nutzungsregeln und habe die Datenschutzhinweise gelesen.</label><button id="submit">Einloggen</button><button id="toggle" class="secondary" style="margin-top:8px">Noch nicht registriert</button><p id="error" class="muted"></p><div class="footer">Impressum · Datenschutz · Nutzungsregeln<br>Vor dem öffentlichen Launch müssen die Betreiberangaben und Rechtstexte ergänzt werden.</div>
</div></section>
<section id="app" class="app hidden">
<aside class="side"><h2>ChatVZ</h2><p id="meLabel" class="muted"></p><button id="logout" class="secondary">Abmelden</button><nav class="nav"><button id="showUsers">👥 Benutzer</button><button id="showRooms" class="secondary">💬 Räume</button></nav><section id="roomSection"><h3>Räume</h3><div id="rooms" class="rooms"></div></section><section id="userSection"><h3>Alle Benutzer</h3><input id="search" placeholder="Benutzer oder Stadt suchen"><div id="users"></div></section></aside>
<main class="main"><div class="top"><strong id="chatTitle">Lounge</strong><span id="status" class="muted">Verbinde…</span></div><div id="messages" class="messages"></div><div class="composer"><label><input id="chatFile" class="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><button class="secondary" id="photoBtn">📷</button></label><input id="text" placeholder="Nachricht…"><button id="send">Senden</button></div></main>
<aside class="profile"><div id="myProfile"><h3>Mein Profil</h3><img id="avatar" class="avatar" alt=""><p><b id="profileNick"></b></p><input id="avatarFile" class="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><button class="secondary" id="avatarBtn">Profilbild ändern</button><h4>Meine Galerie</h4><input id="galleryFile" class="file" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif"><button class="secondary" id="galleryBtn">Bilder hinzufügen</button><div id="gallery" class="gallery" style="margin-top:10px"></div><hr><button id="deleteAccount" class="danger">Konto löschen</button><div id="adminPanel" class="hidden"><hr><h3>🛡️ Moderation</h3><div id="reports"></div></div></div><div id="userProfile" class="hidden"><h3 id="userProfileTitle">Profil</h3><img id="userAvatar" class="avatar" alt=""><p><b id="userNick"></b></p><p id="userInfo" class="muted"></p><p id="userAbout"></p><div style="display:flex;gap:6px;flex-wrap:wrap"><button id="dmBtn">💬 Nachricht</button><button id="favBtn" class="secondary">⭐ Favorisieren</button><button id="blockBtn" class="danger">🚫 Blockieren</button><button id="reportUserBtn" class="secondary">⚠️ Melden</button></div><h4>Galerie</h4><div id="userGallery" class="gallery"></div></div></aside>
</section>
<script>
let token=localStorage.getItem("chatvz_token"), me=null, ws=null, roomId=1, dmUser=null, register=false, selectedUser=null;
const $=id=>document.getElementById(id), api=async(path,opt={})=>{opt.headers=opt.headers||{};opt.headers.Authorization="Bearer "+token;const r=await fetch(path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Fehler");return d};
function err(e){$("error").textContent=e.message}
$("toggle").onclick=()=>{register=!register;$("regFields").classList.toggle("hidden",!register);$("consentWrap").classList.toggle("hidden",!register);$("submit").textContent=register?"Registrieren":"Einloggen";$("toggle").textContent=register?"Zum Login":"Noch nicht registriert"};
$("submit").onclick=async()=>{try{const body={nick:$("nick").value,password:$("password").value};if(register){if(!$("consent").checked)throw Error("Bitte bestätige Nutzungsregeln und Datenschutzhinweise.");body.age=Number($("age").value);body.city=$("city").value}const d=await fetch(register?"/api/register":"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(r=>r.json().then(x=>{if(!r.ok)throw Error(x.error);return x}));token=d.token;localStorage.setItem("chatvz_token",token);start()}catch(e){err(e)}};
async function start(){try{me=await api("/api/me");$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("meLabel").textContent=me.nick+" · "+me.age;$("profileNick").textContent=me.nick;setAvatar(me.avatar_url);$("adminPanel").classList.toggle("hidden",!me.is_admin);if(me.is_admin)loadReports();await loadRooms();await loadUsers();await loadGallery();connect()}catch(e){localStorage.removeItem("chatvz_token");$("error").textContent="Sitzung abgelaufen."}}
function setAvatar(u){$("avatar").src=u||"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90'><rect width='100%' height='100%' fill='%23dbe4f0'/><text x='50%' y='55%' text-anchor='middle' font-size='32'>👤</text></svg>"}
async function loadRooms(){const rs=await api("/api/rooms");$("rooms").innerHTML=rs.map(r=>'<div class="room" data-id="'+r.id+'">💬 '+r.name+'</div>').join("");document.querySelectorAll(".room").forEach(x=>x.onclick=()=>joinRoom(Number(x.dataset.id),x.textContent.trim()))}
async function joinRoom(id,name){dmUser=null;roomId=id;$("chatTitle").textContent=name;$("messages").innerHTML="";const ms=await api("/api/rooms/"+id+"/messages");ms.forEach(renderRoom);if(ws?.readyState===1)ws.send(JSON.stringify({type:"join_room",roomId:id}))}
let usersCache=[];async function loadUsers(){const q=$("search").value||"";usersCache=await api("/api/users?q="+encodeURIComponent(q));$("users").innerHTML=usersCache.map(u=>'<div class="user" data-id="'+u.id+'"><img class="uavatar" src="'+(u.avatar_url||avatarFallback())+'"><div class="udata"><b><span class="online" style="background:'+(u.online?"#12b76a":"#98a2b3")+'"></span>'+esc(u.nick)+'</b><span class="small">'+esc(String(u.age))+ (u.city?' · '+esc(u.city):'')+'</span></div></div>').join("");document.querySelectorAll(".user").forEach(x=>x.onclick=()=>showUserProfile(Number(x.dataset.id)))}
function avatarFallback(){return "data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90'><rect width='100%' height='100%' fill='#dbe4f0'/><text x='50%' y='55%' text-anchor='middle' font-size='32'>👤</text></svg>")}
async function showUserProfile(id){const u=usersCache.find(x=>String(x.id)===String(id));if(!u)return;selectedUser=u;$("myProfile").classList.add("hidden");$("userProfile").classList.remove("hidden");$("userNick").textContent=u.nick;$("userAvatar").src=u.avatar_url||avatarFallback();$("userInfo").textContent=(u.online?'🟢 Online':'⚪ Offline')+' · '+u.age+(u.city?' · '+u.city:'');$("userAbout").textContent=u.about||"Keine Beschreibung hinterlegt.";const gs=await api("/api/users/"+id+"/gallery");$("userGallery").innerHTML=gs.map(g=>'<img src="'+g.url+'" loading="lazy">').join("");$("dmBtn").onclick=()=>openDm(id);$("favBtn").onclick=async()=>{await api("/api/favorite/"+id,{method:"POST"});alert("Zu Favoriten hinzugefügt.")};$("blockBtn").onclick=async()=>{if(confirm("Diesen Benutzer blockieren?")){await api("/api/block/"+id,{method:"POST"});await loadUsers();$("userProfile").classList.add("hidden");$("myProfile").classList.remove("hidden")}}}
$("search").oninput=()=>loadUsers();$("showUsers").onclick=()=>{$("userSection").classList.remove("hidden");$("roomSection").classList.add("hidden")};$("showRooms").onclick=()=>{$("roomSection").classList.remove("hidden");$("userSection").classList.remove("hidden")};
async function openDm(id){dmUser=id;const u=usersCache.find(x=>String(x.id)===String(id));$("chatTitle").textContent="Privatchat · "+(u?.nick||"Benutzer");$("messages").innerHTML="";const ms=await api("/api/dm/"+id);ms.forEach(renderDm)}
function connect(){const p=location.protocol==="https:"?"wss":"ws";ws=new WebSocket(p+"://"+location.host+"?token="+encodeURIComponent(token));ws.onopen=()=>{$("status").textContent="Online";ws.send(JSON.stringify({type:"join_room",roomId}));};ws.onclose=()=>{$("status").textContent="Offline";setTimeout(connect,2500)};ws.onmessage=e=>{const x=JSON.parse(e.data);if(x.type==="room_message")renderRoom(x.message);if(x.type==="dm")renderDm(x.message);if(x.type==="message_deleted")removeMessage(x.messageId)}}
function renderRoom(m){if(dmUser)return;addMsg(m.nick,m.text,m.nick===me.nick,m.image_url,m.id)}
function renderDm(m){addMsg(m.nick,m.text,String(m.sender_id)===String(me.id),m.image_url,m.id)}
function addMsg(n,t,mine,img,id){const d=document.createElement("div");d.className="msg "+(mine?"mine":"");d.dataset.messageId=id||"";d.innerHTML='<div class="meta">'+esc(mine?"Du":n)+'</div>'+esc(t||"");if(img){const im=document.createElement("img");im.src=img;im.loading="lazy";d.appendChild(im);const rb=document.createElement("button");rb.className="secondary reportBtn";rb.textContent="⚠️ Melden";rb.onclick=()=>reportContent({messageId:id,messageType:dmUser?"dm":"room"});d.appendChild(rb);if(mine){const b=document.createElement("button");b.className="secondary deleteImage";b.textContent="🗑️ Bild löschen";b.style.marginTop="7px";b.onclick=()=>deleteChatImage(id,dmUser);d.appendChild(b)}}$("messages").appendChild(d);$("messages").scrollTop=$("messages").scrollHeight}
async function deleteChatImage(id,isDm){if(!id)return;if(!confirm("Eigenes Bild wirklich löschen?"))return;try{await api((isDm?"/api/dm-message/":"/api/chat-message/")+id,{method:"DELETE"});removeMessage(id)}catch(e){alert(e.message)}}
function removeMessage(id){document.querySelectorAll(".msg").forEach(x=>{if(String(x.dataset.messageId)===String(id))x.remove()})}
function esc(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
async function upload(file,endpoint,field="image"){const f=new FormData();f.append(field,file);return api(endpoint,{method:"POST",body:f})}
$("send").onclick=send;$("text").onkeydown=e=>{if(e.key==="Enter")send()};
$("photoBtn").onclick=()=>$("chatFile").click();$("chatFile").onchange=()=>{if($("chatFile").files[0])sendImage($("chatFile").files[0])};
async function send(){const t=$("text").value.trim();if(!t||!ws||ws.readyState!==1)return;ws.send(JSON.stringify(dmUser?{type:"dm",to:dmUser,text:t}:{type:"room_message",text:t}));$("text").value=""}
async function sendImage(file){try{const d=await upload(file,"/api/chat-image");if(ws?.readyState===1)ws.send(JSON.stringify(dmUser?{type:"dm",to:dmUser,text:"",imageUrl:d.url}:{type:"room_message",text:"",imageUrl:d.url}));$("chatFile").value=""}catch(e){alert(e.message)}}
$("avatarBtn").onclick=()=>$("avatarFile").click();$("avatarFile").onchange=async()=>{try{const d=await upload($("avatarFile").files[0],"/api/me/avatar");setAvatar(d.url);me.avatar_url=d.url}catch(e){alert(e.message)}};
$("galleryBtn").onclick=()=>$("galleryFile").click();$("galleryFile").onchange=async()=>{try{const f=new FormData();for(const x of $("galleryFile").files)f.append("images",x);await api("/api/me/gallery",{method:"POST",body:f});await loadGallery();$("galleryFile").value=""}catch(e){alert(e.message)}};
async function loadGallery(){const gs=await api("/api/users/"+me.id+"/gallery");$("gallery").innerHTML=gs.map(g=>'<img src="'+g.url+'" loading="lazy" title="Bild '+g.id+'">').join("")}
async function reportContent(data){const reason=prompt("Meldegrund (z.B. Beleidigung, illegaler Inhalt, Spam):");if(!reason)return;try{await api("/api/report",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...data,reason})});alert("Meldung wurde übermittelt.");}catch(e){alert(e.message)}}
$("reportUserBtn").onclick=()=>selectedUser&&reportContent({targetUserId:selectedUser.id,messageType:"user"});
$("deleteAccount").onclick=async()=>{if(!confirm("Konto dauerhaft löschen? Profil, Galerie und gespeicherte Chatdaten werden gelöscht."))return;try{await api("/api/me",{method:"DELETE"});localStorage.removeItem("chatvz_token");location.reload()}catch(e){alert(e.message)}};
async function loadReports(){try{const rs=await api("/api/admin/reports");$("reports").innerHTML=rs.length?rs.map(r=>'<div class="adminReport"><b>#'+r.id+' · '+esc(r.reason)+'</b><div class="small">Von '+esc(r.reporter_nick)+(r.target_nick?' · Nutzer: '+esc(r.target_nick):'')+(r.message_id?' · Nachricht #'+r.message_id:'')+'</div><p>'+esc(r.details||"Keine Details")+'</p><button onclick="resolveReport('+r.id+',\'resolved\')">Erledigt</button> <button class="secondary" onclick="resolveReport('+r.id+',\'rejected\')">Ablehnen</button></div>').join(""):'<span class="muted">Keine offenen Meldungen.</span>'}catch(e){$("reports").textContent=e.message}}
async function resolveReport(id,status){try{await api("/api/admin/reports/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});loadReports()}catch(e){alert(e.message)}}
$("logout").onclick=()=>{localStorage.removeItem("chatvz_token");location.reload()};
if(token)start();
</script></body></html>
