services:
  - type: web
    name: chatvz-backend
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: chatvz-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chatvz-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads

databases:
  - name: chatvz-db
    plan: free
